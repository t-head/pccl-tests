name: pccl-tests feature request
description: Propose a new benchmark, collective coverage, option, correctness check, or documentation improvement
title: "[Feature]: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Propose a new capability or improvement. Describe the need and its value; the acceptance
        criteria and test plan can be refined with maintainers. Use the Task form for implementation,
        testing, documentation, refactoring, or maintenance work. Check
        [existing requests](https://github.com/t-head/pccl-tests/issues?q=is%3Aissue%20type%3AFeature)
        first and link related discussions. Issues are public; do not include internal-only information.
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: Describe the benchmark, collective, option, correctness check, or documentation improvement you need and its scope. Include relevant PPU platform, PCCL version, and MPI constraints; a detailed implementation proposal is not required.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background and value
      description: Who benefits and in which use cases? Is this specific to a PPU model, PCCL or SAIL SDK version, device-side implementation, or multi-node topology? How does it improve current testing or performance analysis, and how urgent is it?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Test acceptance criteria
      description: |
        The measurable conditions that define completion. State the target Zhenwu PPU platforms (for
        example Zhenwu M890), how to build and run the check (`build.sh` options, benchmark
        executable, CLI arguments, MPI launch, and environment variables), and the expected result.
        Correctness criteria must state the expected `#wrong` value; performance criteria must state
        the metric (`algbw` or `busbw`), message sizes, ranks, timing mode, and comparison baseline.
        These criteria must match the tests reported in the pull request's Validation section. State
        what is known now and note any criteria to refine with maintainers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How do you test or measure this today, what alternatives did you consider, and what limitations remain?
    validations:
      required: false
